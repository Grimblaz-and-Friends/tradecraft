name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The version-bump guard resolves a merge base; a shallow clone has
          # none, and the guard exits 2 (undetermined) rather than passing.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Packaging lint
        run: python tools/lint.py
      - name: Version bump (ADR-003)
        if: github.event_name == 'pull_request'
        run: python tools/check_version_bump.py --base "origin/${{ github.base_ref }}"
      # A step inside the existing required job, never a new job: a guard whose
      # job the ruleset does not require blocks nothing. Both constitutional
      # guards resolve a merge base, so they are pull_request-gated like the
      # version bump above.
      - name: Constitutional format (statute §12)
        if: github.event_name == 'pull_request'
        run: >
          python tools/check_constitution.py
          --base "origin/${{ github.base_ref }}"
          --pr "${{ github.event.pull_request.number }}"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest tools/tests skills -q
