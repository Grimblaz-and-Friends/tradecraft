name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Packaging lint
        run: python tools/lint.py
      - name: Tests
        # `-n auto` because the suite is overwhelmingly waiting on subprocesses
        # rather than computing: about nine tenths of its wall is inside
        # `subprocess`, and almost all of that is `git` starting up, which costs
        # an order of magnitude more per launch on Windows than on Linux.
        #
        # `--dist loadfile` is not a tuning choice. Several modules build their
        # git fixture once per module and copy it per test; under the default
        # `--dist load` a module's tests scatter across workers and each worker
        # rebuilds that fixture, paying those launches once per worker instead
        # of once. Keeping a module's tests on one worker is what makes the
        # once-per-module fixture actually cost once.
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tools/tests skills lib/tests -q -n auto --dist loadfile
