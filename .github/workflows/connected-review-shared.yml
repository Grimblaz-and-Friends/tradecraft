name: connected-review-shared

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  TRADECRAFT_REPOSITORY: Grimblaz-and-Friends/tradecraft
  CLAUDE_CLI_VERSION: 2.1.280
  REVIEW_OWNER_LOGIN: Grimblaz

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reviewer_sha: ${{ steps.identity.outputs.reviewer_sha }}
      admitted: ${{ steps.eligibility.outputs.admitted }}
      visibility: ${{ steps.eligibility.outputs.visibility }}
      head: ${{ steps.eligibility.outputs.head }}
      reason: ${{ steps.eligibility.outputs.reason }}
      number: ${{ steps.eligibility.outputs.number }}
    steps:
      - name: Capture trusted prepare workflow identity
        id: identity
        shell: python
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          import os
          from pathlib import Path
          import re
          import sys

          sys.stdout.reconfigure(encoding="utf-8", newline="")
          sys.stderr.reconfigure(encoding="utf-8", newline="")
          if os.environ["WORKFLOW_REPOSITORY"] != "Grimblaz-and-Friends/tradecraft":
              raise SystemExit("called reviewer workflow repository is invalid")
          if os.environ["WORKFLOW_FILE_PATH"] != ".github/workflows/connected-review-shared.yml":
              raise SystemExit("called reviewer workflow path is invalid")
          revision = os.environ["WORKFLOW_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("called reviewer workflow commit is unavailable or invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("ab") as output:
              output.write(f"reviewer_sha={revision}\n".encode("utf-8"))
      - name: Fetch trusted reviewer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.TRADECRAFT_REPOSITORY }}
          ref: ${{ steps.identity.outputs.reviewer_sha }}
          path: .connected-review-runtime
          persist-credentials: false
      - name: Verify trusted reviewer checkout
        shell: python
        env:
          CONNECTED_REVIEW_REVIEWER_SHA: ${{ steps.identity.outputs.reviewer_sha }}
        run: |
          import os
          import subprocess
          import sys

          sys.stdout.reconfigure(encoding="utf-8", newline="")
          sys.stderr.reconfigure(encoding="utf-8", newline="")
          result = subprocess.run(
              ["git", "-C", ".connected-review-runtime", "rev-parse", "HEAD"],
              stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              encoding="utf-8", errors="replace", check=True,
          )
          if result.stdout.strip() != os.environ["CONNECTED_REVIEW_REVIEWER_SHA"]:
              raise SystemExit("trusted reviewer checkout does not match the workflow commit")
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Check eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .connected-review-runtime/lib/connected_review.py eligibility

  review:
    needs: prepare
    if: needs.prepare.outputs.admitted == 'true'
    runs-on: ${{ needs.prepare.outputs.visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 120
    concurrency:
      group: connected-review-${{ github.repository }}-${{ needs.prepare.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    outputs:
      status: ${{ steps.review.outputs.status }}
      cause: ${{ steps.review.outputs.cause }}
      usage: ${{ steps.review.outputs.usage }}
    steps:
      - name: Capture trusted review workflow identity
        id: identity
        shell: python
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CAPTURED_REVIEWER_SHA: ${{ needs.prepare.outputs.reviewer_sha }}
        run: |
          import os
          from pathlib import Path
          import re
          import sys

          sys.stdout.reconfigure(encoding="utf-8", newline="")
          sys.stderr.reconfigure(encoding="utf-8", newline="")
          if os.environ["WORKFLOW_REPOSITORY"] != "Grimblaz-and-Friends/tradecraft":
              raise SystemExit("called reviewer workflow repository is invalid")
          if os.environ["WORKFLOW_FILE_PATH"] != ".github/workflows/connected-review-shared.yml":
              raise SystemExit("called reviewer workflow path is invalid")
          revision = os.environ["WORKFLOW_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("called reviewer workflow commit is unavailable or invalid")
          captured = os.environ["CAPTURED_REVIEWER_SHA"]
          if not captured:
              raise SystemExit("preparation supplied no reviewer commit")
          if captured and captured != revision:
              raise SystemExit("called reviewer workflow commit disagrees with preparation")
          with Path(os.environ["GITHUB_OUTPUT"]).open("ab") as output:
              output.write(f"reviewer_sha={revision}\n".encode("utf-8"))
      - name: Fetch trusted reviewer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.TRADECRAFT_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.reviewer_sha }}
          path: .connected-review-runtime
          persist-credentials: false
      - name: Verify trusted reviewer checkout
        shell: python
        env:
          CONNECTED_REVIEW_REVIEWER_SHA: ${{ needs.prepare.outputs.reviewer_sha }}
        run: |
          import os
          import subprocess
          import sys

          sys.stdout.reconfigure(encoding="utf-8", newline="")
          sys.stderr.reconfigure(encoding="utf-8", newline="")
          result = subprocess.run(
              ["git", "-C", ".connected-review-runtime", "rev-parse", "HEAD"],
              stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              encoding="utf-8", errors="replace", check=True,
          )
          if result.stdout.strip() != os.environ["CONNECTED_REVIEW_REVIEWER_SHA"]:
              raise SystemExit("trusted reviewer checkout does not match the workflow commit")
      - name: Set up hosted Python
        if: needs.prepare.outputs.visibility == 'public'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install hosted Claude CLI
        if: needs.prepare.outputs.visibility == 'public'
        run: npm install --global @anthropic-ai/claude-code@"$CLAUDE_CLI_VERSION"
      - name: Run connected review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONNECTED_REVIEW_REVIEWER_SHA: ${{ needs.prepare.outputs.reviewer_sha }}
          CONNECTED_REVIEW_VISIBILITY: ${{ needs.prepare.outputs.visibility }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .connected-review-runtime/lib/connected_review.py review
          --finder-prompt ".connected-review-runtime/skills/connected-review/references/finder.md"

  report:
    needs: [prepare, review]
    if: >-
      always() &&
      (needs.prepare.result != 'success' || needs.prepare.outputs.admitted == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Capture trusted report workflow identity
        id: identity
        shell: python
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CAPTURED_REVIEWER_SHA: ${{ needs.prepare.outputs.reviewer_sha }}
        run: |
          import os
          from pathlib import Path
          import re
          import sys

          sys.stdout.reconfigure(encoding="utf-8", newline="")
          sys.stderr.reconfigure(encoding="utf-8", newline="")
          if os.environ["WORKFLOW_REPOSITORY"] != "Grimblaz-and-Friends/tradecraft":
              raise SystemExit("called reviewer workflow repository is invalid")
          if os.environ["WORKFLOW_FILE_PATH"] != ".github/workflows/connected-review-shared.yml":
              raise SystemExit("called reviewer workflow path is invalid")
          revision = os.environ["WORKFLOW_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("called reviewer workflow commit is unavailable or invalid")
          captured = os.environ["CAPTURED_REVIEWER_SHA"]
          if captured and captured != revision:
              raise SystemExit("called reviewer workflow commit disagrees with preparation")
          with Path(os.environ["GITHUB_OUTPUT"]).open("ab") as output:
              output.write(f"reviewer_sha={revision}\n".encode("utf-8"))
      - name: Fetch trusted reporter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.TRADECRAFT_REPOSITORY }}
          ref: ${{ steps.identity.outputs.reviewer_sha }}
          path: .connected-review-runtime
          persist-credentials: false
      - name: Verify trusted reviewer checkout
        shell: python
        env:
          CONNECTED_REVIEW_REVIEWER_SHA: ${{ steps.identity.outputs.reviewer_sha }}
        run: |
          import os
          import subprocess
          import sys

          sys.stdout.reconfigure(encoding="utf-8", newline="")
          sys.stderr.reconfigure(encoding="utf-8", newline="")
          result = subprocess.run(
              ["git", "-C", ".connected-review-runtime", "rev-parse", "HEAD"],
              stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              encoding="utf-8", errors="replace", check=True,
          )
          if result.stdout.strip() != os.environ["CONNECTED_REVIEW_REVIEWER_SHA"]:
              raise SystemExit("trusted reviewer checkout does not match the workflow commit")
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Reconcile review or report skip
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTED_REVIEW_REVIEWER_SHA: ${{ steps.identity.outputs.reviewer_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REVIEW_CAUSE: ${{ needs.review.outputs.cause }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_USAGE: ${{ needs.review.outputs.usage }}
        run: python .connected-review-runtime/lib/connected_review.py report
